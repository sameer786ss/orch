[workspace]
resolver = "3"
members = [
    "crates/harness",
    "services/cloud",
    "apps/desktop/src-tauri",
]

[workspace.dependencies]
async-trait        = "0.1"
base64             = "0.22"
dashmap            = "6"
dunce              = "1"
futures            = "0.3"
http               = "1"
mime_guess         = "2"
moka               = { version = "0.12", features = ["future", "sync"] }
parking_lot        = "0.13"
reqwest            = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
reqwest-middleware = { version = "0.5.2", features = ["json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tempfile           = "3"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "process", "net", "signal"] }
tokio-util         = "0.7"
tracing            = "0.1"
tracing-subscriber = "0.3"
uuid               = { version = "1", features = ["v4"] }
windows            = "0.62.2"
orchharness        = { path = "crates/harness" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
