[package]
name = "orch"
version = "1.0.5"
description = "Orch Desktop Application"
authors = ["Orch"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "orch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
orchharness        = { workspace = true, features = ["local-fs"] }
async-trait        = { workspace = true }
base64             = { workspace = true }
dashmap            = { workspace = true }
dunce              = { workspace = true }
futures            = { workspace = true }
http               = { workspace = true }
mime_guess         = { workspace = true }
moka               = { workspace = true, features = ["future"] }
parking_lot        = { workspace = true }
reqwest            = { workspace = true, features = ["form"] }
reqwest-middleware = { version = "0.5.2", features = ["json"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }

tauri                        = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-opener          = "2"
tauri-plugin-deep-link       = "2"
tauri-plugin-dialog          = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state    = "2"
tauri-plugin-store           = "2"
tauri-plugin-updater         = "2"
tauri-plugin-process         = "2"
tokio-tungstenite            = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
cpal                         = "0.15"
hound                        = "3"
rubato                       = "0.15"
ringbuf                      = "0.4"
keyring                      = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
sqlx                         = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
portable-pty                 = "0.8"
sentry                       = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
nucleo-matcher               = "0.3"
encoding_rs                  = "0.8"
arc-swap                     = "1.9.3"
sentry-tracing               = "0.36.0"
secrecy                      = "0.10.3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[lints]
workspace = true
