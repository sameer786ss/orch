name: Build & Release

# Builds apps/desktop. Release by pushing a tag:  git tag code-v1.0.0 && git push origin code-v1.0.0
# The tag is the version: it is stamped into tauri.conf.json, Cargo.toml and package.json.
# One release per version (code-vX.Y.Z). Desktop releases are flagged as GitHub's "latest", so
# releases/latest/download/<file> always serves the newest desktop installer and latest.json.
# Windows auto-updates directly via latest.json; macOS checks latest.json and redirects users
# to the GitHub Releases page for manual DMG replacement.
on:
  push:
    tags: ['code-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/code-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Orch Desktop
          draft: false
          prerelease: false
          make_latest: true

  build-mac:
    name: Build & Publish macOS (${{ matrix.target }})
    if: needs.create-release.result == 'success' || needs.create-release.result == 'skipped'
    runs-on: macos-latest
    needs: create-release
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: Orch-macOS-arm64.dmg
          - target: x86_64-apple-darwin
            artifact: Orch-macOS-x64.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/code-v')
        shell: bash
        run: node ../../scripts/stamp-desktop-version.mjs "${GITHUB_REF_NAME#code-v}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Build macOS (${{ matrix.target }})
        if: startsWith(github.ref, 'refs/tags/code-v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build --target ${{ matrix.target }} -- --profile dist

      - name: Prepare macOS Asset
        if: startsWith(github.ref, 'refs/tags/code-v')
        run: cp ../../target/${{ matrix.target }}/dist/bundle/dmg/*.dmg ${{ matrix.artifact }}

      - name: Publish macOS Asset
        if: startsWith(github.ref, 'refs/tags/code-v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Orch Desktop
          files: apps/desktop/${{ matrix.artifact }}

  build-windows:
    name: Build & Publish Windows
    if: needs.create-release.result == 'success' || needs.create-release.result == 'skipped'
    runs-on: windows-latest
    needs: create-release
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/code-v')
        shell: bash
        run: node ../../scripts/stamp-desktop-version.mjs "${GITHUB_REF_NAME#code-v}"

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Build Windows Setup Executable
        if: startsWith(github.ref, 'refs/tags/code-v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build -- --profile dist

      - name: Prepare Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/code-v')
        shell: powershell
        run: |
          $setup = (Get-Item ../../target/dist/bundle/nsis/*-setup.exe).FullName
          Copy-Item $setup -Destination Orch-Windows-Setup.exe

          $sigPath = (Get-Item ../../target/dist/bundle/nsis/*-setup.exe.sig).FullName
          $signature = (Get-Content $sigPath -Raw).Trim()

          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^code-v', ''
          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated release $tag. See the GitHub release page for details."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/Orch-Windows-Setup.exe"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json)

      - name: Publish Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/code-v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Orch Desktop
          files: |
            apps/desktop/Orch-Windows-Setup.exe
            apps/desktop/latest.json
