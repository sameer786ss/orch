name: Desktop Build

# Builds apps/desktop from main via workflow_dispatch:
#   gh workflow run code-release.yml -f version=1.0.6
# Running on main ensures every release reads and updates main's build cache.
# The version input (MAJOR.MINOR.PATCH) is stamped into tauri.conf.json, Cargo.toml
# and package.json, and published under tag code-vX.Y.Z as GitHub's "latest" desktop release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6)"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        run: |
          version="${{ inputs.version }}"
          tag="code-v${version}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Orch Desktop v${version}" \
              --notes ""
          fi

  build-mac:
    name: Build & Publish macOS (${{ matrix.target }})
    runs-on: macos-latest
    needs: create-release
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: Orch-macOS-arm64.dmg
          - target: x86_64-apple-darwin
            artifact: Orch-macOS-x64.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stamp version
        shell: bash
        run: node ../../scripts/stamp-desktop-version.mjs "${{ inputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Build macOS (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }} -- --profile dist

      - name: Prepare macOS Asset
        run: cp ../../target/${{ matrix.target }}/dist/bundle/dmg/*.dmg ${{ matrix.artifact }}

      - name: Publish macOS Asset
        run: gh release upload "code-v${{ inputs.version }}" "${{ matrix.artifact }}" --clobber

  build-windows:
    name: Build & Publish Windows
    runs-on: windows-latest
    needs: create-release
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stamp version
        shell: bash
        run: node ../../scripts/stamp-desktop-version.mjs "${{ inputs.version }}"

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Build Windows Setup Executable
        run: npx tauri build -- --profile dist

      - name: Prepare Windows Asset & Updater Manifest
        shell: powershell
        run: |
          $setup = (Get-Item ../../target/dist/bundle/nsis/*-setup.exe).FullName
          Copy-Item $setup -Destination Orch-Windows-Setup.exe

          $sigPath = (Get-Item ../../target/dist/bundle/nsis/*-setup.exe.sig).FullName
          $signature = (Get-Content $sigPath -Raw).Trim()

          $version = "${{ inputs.version }}"
          $tag = "code-v$version"
          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated release $tag. See the GitHub release page for details."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/Orch-Windows-Setup.exe"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json)

      - name: Publish Windows Asset & Updater Manifest
        run: gh release upload "code-v${{ inputs.version }}" Orch-Windows-Setup.exe latest.json --clobber
