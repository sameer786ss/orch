name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Build signed release APK
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          version="${{ inputs.version }}"
          tag="app-v${version}"
          IFS=. read -r major minor patch <<< "$version"
          export VERSION_NAME="$version"
          export VERSION_CODE=$(( major * 1000000 + minor * 1000 + patch ))
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" Orch.apk
          sha256sum Orch.apk > Orch.apk.sha256
          size_bytes=$(stat -c%s Orch.apk)
          cat > app-latest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "tag": "${tag}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Orch.apk",
            "checksumUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Orch.apk.sha256",
            "sizeBytes": ${size_bytes}
          }
          EOF

      - name: Publish Orch.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          tag="app-v${version}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" Orch.apk Orch.apk.sha256 app-latest.json \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Orch Mobile v${version}" \
            --notes ""
