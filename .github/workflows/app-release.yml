name: Release

# Builds apps/mobile and publishes the finished APK as Orch.apk on the release app-vX.Y.Z.
# The app's updater reads these releases, so the asset name must stay Orch.apk.
# Mobile releases are never flagged as GitHub's "latest" (that flag belongs to the desktop releases).
# Release by pushing a version tag:  git tag app-v1.0.0 && git push origin app-v1.0.0
on:
  push:
    tags: ["app-v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Restores and saves the Gradle user home, dependency and build caches.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Build signed release APK
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${GOOGLE_SERVICES_JSON_BASE64:?Missing GOOGLE_SERVICES_JSON_BASE64 secret}"
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 secret}"
          # app-vMAJOR.MINOR.PATCH -> versionName MAJOR.MINOR.PATCH, versionCode MAJOR*1000000 + MINOR*1000 + PATCH.
          # The app's updater uses the same formula to compare versions.
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#app-v}"
          export VERSION_NAME="${GITHUB_REF_NAME#app-v}"
          export VERSION_CODE=$(( major * 1000000 + minor * 1000 + patch ))
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" Orch.apk
          sha256sum Orch.apk > Orch.apk.sha256

      - name: Publish Orch.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" Orch.apk Orch.apk.sha256 \
            --verify-tag \
            --latest=false \
            --title "Orch Mobile" \
            --notes ""
