[package]
name = "orchharness"
version = "0.1.0"
edition = "2021"

[features]
default = []
local-fs = [
    "dep:dunce",
    "dep:grep-regex",
    "dep:grep-searcher",
    "dep:ignore",
    "dep:process-wrap",
    "dep:envvars",
    "dep:tempfile",
]

[dependencies]
async-trait        = { workspace = true }
base64             = { workspace = true }
futures            = { workspace = true }
http               = { workspace = true }
moka               = { workspace = true }
parking_lot        = { workspace = true }
reqwest            = { workspace = true }
reqwest-middleware = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
tracing            = { workspace = true }
uuid               = { workspace = true }
dunce              = { workspace = true, optional = true }
tempfile           = { workspace = true, optional = true }

rig                = { version = "0.45.0", default-features = false, features = ["agent", "derive", "reqwest", "rustls", "reqwest-middleware-rustls"] }
rig-memory         = { version = "0.45.0", default-features = false }
gray_matter        = "0.2"
grep-regex         = { version = "0.1", optional = true }
grep-searcher      = { version = "0.1", optional = true }
ignore             = { version = "0.4", optional = true }
include_dir        = { version = "0.7", features = ["glob"] }
path-clean         = "1.0"
process-wrap       = { version = "9", features = ["tokio1", "process-group", "process-session", "job-object", "creation-flags", "kill-on-drop"], optional = true }
regex              = "1.11"
reqwest-retry      = "0.9.1"
schemars           = "1.0"
similar            = "3.2.1"
thiserror          = "2"
xxhash-rust        = { version = "0.8", features = ["xxh3"] }
envvars            = { version = "0.1.10", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }
